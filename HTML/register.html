<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/register_style.css">
  <title>Register page</title>
</head>
<body>
<main class="page">
  <section class="card">
    <h1>Înregistrează-te</h1>

    <form class="register-form" action="#" method="post"
          enctype="multipart/form-data">

      <div class="row">
        <label for="username">Nume utilizator</label>
        <input type="text" id="username" name="username" placeholder="ex: ioanaTW"
               required>
      </div>

      <div class="row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="example@example.example" required>
      </div>

      <div>
        <label for="password">Parolă</label>
        <input type="password" id="password" name="password" placeholder="..." required>
      </div>

      <div>
        <label for="confirm_password">Confirmă parola</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="..." required>
      </div>

      <div>
        <label>Gen</label>
        <div class="checkbox-grid column">
          <label><input type="radio" name="gen" value="f" required> Feminin</label>
          <label><input type="radio" name="gen" value="m"> Masculin</label>
        </div>
      </div>

      <div class="row">
        <label for="accountType">Tip cont</label>
        <select id="accountType" name="account_type" required>
          <option value="" disabled selected>Alege o opțiune</option>
          <option value="student">Student</option>
          <option value="profesor">Profesor</option>
        </select>
      </div>

      <div class="row">
        <label>Interese</label>
        <div class="checkbox-grid">
          <label><input type="checkbox" name="interese" value="web"> Front end</label>
          <label><input type="checkbox" name="interese" value="retele"> Back end</label>
          <label><input type="checkbox" name="interese" value="ai"> AI</label>
          <label><input type="checkbox" name="interese" value="javascript"> JavaScript</label>
        </div>
      </div>

      <div class="row">
        <label for="file">Încarcă poza de profil</label>
        <input type="file" id="file" name="profile_pic">
      </div>

      <div class="row">
        <label for="description">Scurtă descriere</label>
        <input type="text" id="description" name="description" placeholder="..." required>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary">Înregistrează-te</button>
        <button type="reset" class="btn ghost">Resetează</button>
      </div>



      <p class="login-link"> Ai deja cont?
        <a href="login.html">Mergi la login</a></p>

    </form>
  </section>
</main>
</body>
</html>
