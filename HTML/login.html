<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login_style.css">

</head>

<body>
<div class="login-container">
    <div class="login-image">
        <img src="../MEDIA/logo_uvt.png" alt="Imagine login">
    </div>

    <div class="separator"></div>

    <div class="login-form">
        <h2>Autentificare</h2>
        <form id="loginForm">
        <input type="email" id="email" placeholder="Adresa de email">
        <input type="password" id="password" placeholder="Parolă">
        <button type="submit">Conectează-te</button>
        </form>
        <p class="register-text">Nu ai cont? <a href="register.html">Înregistrează-te</a> </p>
    </div>
</div>
<script src="../JS/login_js.js"></script>
</body>
</html>
